[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-signal-engine"
version = "0.1.0"
description = "Adversarial multi-agent earnings intelligence and event-study signal engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "requests>=2.31.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.22",
    "langgraph>=0.0.20",
    "langchain-core>=0.1.20",
    "scipy>=1.11.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "yfinance>=0.2.36",
    "python-dotenv>=1.0.0",
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.3.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

